name: ci

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "release/**"
      - "fix/**"
      - "ci/**"
      - "verify/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Clippy (default)
        run: cargo clippy --locked --all-targets -- -D warnings
      # `lammpc` links liblammpc, so it stays out of this job. The lammpc job
      # runs the same clippy command with every feature, including lammpc.
      - name: Clippy (library features)
        run: cargo clippy --locked --all-targets --features rgpot,rgpot-session -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Test (default)
        run: cargo test --locked --verbose
      # `lammpc` links liblammpc, so it stays out of this job. The lammpc job
      # tests every feature, including lammpc.
      - name: Test (library features)
        run: cargo test --locked --features rgpot,rgpot-session --verbose
      - name: Doc tests (library features)
        run: cargo test --locked --doc --features rgpot,rgpot-session --verbose
      - name: Public items are documented
        run: cargo rustdoc --locked --features rgpot,rgpot-session -- -D missing_docs
      - name: Rustdoc builds without warnings
        run: ci/check_rustdoc.sh
      - name: Reject machine-local paths
        run: python3 docs/check_paths.py
      - name: Verify documentation structure, stubs, and DOIs
        run: python3 ci/check_links.py
      - name: Dependencies resolve from crates.io with caret requirements and one copy
        run: python3 ci/check_dependency_pins.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "rgflux") | .rust_version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Clippy (library features)
        run: cargo clippy --locked --all-targets --features rgpot,rgpot-session -- -D warnings
      - name: Test (library features)
        run: cargo test --locked --features rgpot,rgpot-session

  lammpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lammpc
          create-args: >-
            meson
            ninja
            pkg-config
            capnproto
            cmake
          condarc: |
            channels:
              - conda-forge
      - name: Fetch lammpc (pinned rev)
        run: |
          set -euo pipefail
          git clone https://github.com/OmniPotentRPC/lammpc "${RUNNER_TEMP}/lammpc"
          git -C "${RUNNER_TEMP}/lammpc" checkout 1d88c16b26eee1f7217d86048c44e1f3ebc6c8e7
      - name: LAMMPS release tag
        id: lammps
        working-directory: ${{ runner.temp }}/lammpc
        run: |
          set -euo pipefail
          tag="$(bash scripts/build_lammps.sh --print-tag)"
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Cache LAMMPS build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lammpc/.lammps-install
          key: lammps-${{ steps.lammps.outputs.tag }}-${{ runner.os }}-1d88c16b26eee1f7217d86048c44e1f3ebc6c8e7
      - name: Build and install lammpc (pinned rev)
        shell: bash -l {0}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/lammpc"
          bash scripts/build_lammps.sh
          meson setup build --prefix="${RUNNER_TEMP}/lammpc-install" -Dwith_tests=false -Dwith_lammps=true -Dlammps_root="$PWD/.lammps-install"
          meson compile -C build
          meson install -C build
      - name: Clippy (all features)
        env:
          LAMMPC_LIB_DIR: ${{ runner.temp }}/lammpc-install/lib/x86_64-linux-gnu
          LD_LIBRARY_PATH: ${{ runner.temp }}/lammpc-install/lib/x86_64-linux-gnu:${{ runner.temp }}/lammpc/.lammps-install/lib:${{ env.LD_LIBRARY_PATH }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all features with lammpc
        env:
          LAMMPC_LIB_DIR: ${{ runner.temp }}/lammpc-install/lib/x86_64-linux-gnu
          LD_LIBRARY_PATH: ${{ runner.temp }}/lammpc-install/lib/x86_64-linux-gnu:${{ runner.temp }}/lammpc/.lammps-install/lib:${{ env.LD_LIBRARY_PATH }}
        run: cargo test --locked --all-features --verbose
      - name: Doc tests (all features)
        env:
          LAMMPC_LIB_DIR: ${{ runner.temp }}/lammpc-install/lib/x86_64-linux-gnu
          LD_LIBRARY_PATH: ${{ runner.temp }}/lammpc-install/lib/x86_64-linux-gnu:${{ runner.temp }}/lammpc/.lammps-install/lib:${{ env.LD_LIBRARY_PATH }}
        run: cargo test --locked --doc --all-features --verbose
      - name: Rustdoc (all features)
        env:
          LAMMPC_LIB_DIR: ${{ runner.temp }}/lammpc-install/lib/x86_64-linux-gnu
          LD_LIBRARY_PATH: ${{ runner.temp }}/lammpc-install/lib/x86_64-linux-gnu:${{ runner.temp }}/lammpc/.lammps-install/lib:${{ env.LD_LIBRARY_PATH }}
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features --document-private-items
