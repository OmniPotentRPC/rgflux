name: ci

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "release/**"
      - "fix/**"
      - "ci/**"
      - "verify/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Clippy (default)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Test (default)
        run: cargo test --locked --verbose
      - name: Test (all features)
        run: cargo test --locked --all-features --verbose
      - name: Public items are documented
        run: cargo rustdoc --locked --all-features -- -D missing_docs
      - name: Rustdoc builds without warnings
        run: ci/check_rustdoc.sh
      - name: Reject machine-local paths
        run: python3 docs/check_paths.py
      - name: Git dependencies pin a full rev and resolve once
        run: python3 ci/check_dependency_pins.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "rgflux") | .rust_version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test (all features)
        run: cargo test --locked --all-features

  lammpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lammpc
          create-args: >-
            meson
            ninja
            pkg-config
            lammps
            minimage
          condarc: |
            channels:
              - conda-forge
      - name: Build and install lammpc (pinned rev)
        shell: bash -l {0}
        run: |
          set -euo pipefail
          git clone https://github.com/OmniPotentRPC/lammpc "${RUNNER_TEMP}/lammpc"
          cd "${RUNNER_TEMP}/lammpc"
          git checkout d44f2333
          meson setup build --prefix="${RUNNER_TEMP}/lammpc-install" -Dwith_lammps=true -Dlammps_root="${CONDA_PREFIX}"
          meson compile -C build
          meson install -C build
      - name: Test lammpc feature
        env:
          LAMMPC_DIR: ${{ runner.temp }}/lammpc-install
          LD_LIBRARY_PATH: ${{ runner.temp }}/lammpc-install/lib:${{ runner.temp }}/lammpc-install/lib64:${{ env.LD_LIBRARY_PATH }}
        run: cargo test --locked --features lammpc --verbose
