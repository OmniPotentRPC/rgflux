name: docs

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "ci/**"
    paths: ["docs/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('docs-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
      - name: Build rustdoc with warnings denied
        run: ci/check_rustdoc.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - name: Reject machine-local paths
        run: python3 docs/check_paths.py
      - name: Export the guides and changelog from Org sources
        run: emacs --batch -l docs/export.el
      - run: python -m pip install -q -r docs/requirements.txt
      - run: sphinx-build -b html -n -W --keep-going docs/source docs/build
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
        with:
          path: docs/build

  deploy:
    needs: [rustdoc, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
