[package]
name = "rgflux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Rare-event kinetics over rgsaddle and rgmin: PAFI, OH-TST, hyperplane sampling, Bennett-Chandler recrossing, FFS and rate networks."
repository = "https://github.com/OmniPotentRPC/rgflux"
readme = "README.md"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
keywords = ["kinetics", "transition-state", "rare-events", "molecular-dynamics"]
categories = ["science"]

[lib]
crate-type = ["lib"]

[features]
default = []
# Static PES adapter over rgpot-core's DLPack potential callback ABI,
# consumed by the native BAOAB integrator.
rgpot = ["dep:rgpot-core"]
# Engine-agnostic MD session adapter wrapping rgpot's MdSession / CAbiMdSession
# contract ("openmm", "nblib", "lammps").
rgpot-session = ["dep:rgpot-core"]
# Direct lammpc-backed DynamicsEngine over lammpc_session_* C ABI. Only this
# engine uses the Cap'n Proto profile wire format, so only it enables the
# rgpot-core `profile` and `schema` features, whose build script needs the
# `capnp` CLI.
lammpc = ["dep:rgpot-core", "rgpot-core/profile", "rgpot-core/schema", "dep:capnp"]

[dependencies]
# Exact crates.io releases. `[patch.crates-io]` overrides them for local
# builds with a full 40-hex commit at the same crate version, so a git
# checkout still unifies one copy. `cargo publish` omits that table.
rgsaddle = { version = "=0.5.0", default-features = false }
rgmin = { version = "=0.6.0", default-features = false }
rgpot-core = { version = "=3.7.0", optional = true }
eindir-core = "0.6.0"
ndarray = "0.17"
rand = "0.9"
thiserror = "2"
capnp = { version = "0.20.6", optional = true }

[dev-dependencies]
approx = "0.5"
proptest = "1.6"

[patch.crates-io]
# Dev overrides of the crates.io releases above. Publish ignores this table.
# Each rev is the develop commit at that version, and the rgmin override
# keeps rgsaddle and this crate on one copy.
rgsaddle = { git = "https://github.com/OmniPotentRPC/rgsaddle", rev = "92a74493d16364a1ba8542a63598ce8bcee5387c" }
rgmin = { git = "https://github.com/OmniPotentRPC/rgmin", rev = "eb8d3e4123183bd3f5ca82852332eeddb5d17f54" }
rgpot-core = { git = "https://github.com/OmniPotentRPC/rgpot", rev = "424629e5ba9c0948b8d6224f5b49c014ffb4ac7c" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[build-dependencies]
pkg-config = "0.3"

[profile.test]
# The PAFI analytic tests integrate millions of Langevin steps. Optimized
# code keeps them fast while debug assertions and overflow checks stay on.
opt-level = 2
