[package]
name = "rgflux"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Rare-event kinetics over rgsaddle and rgmin: PAFI, OH-TST, hyperplane sampling, Bennett-Chandler recrossing, FFS and rate networks."
repository = "https://github.com/OmniPotentRPC/rgflux"
readme = "README.md"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
keywords = ["kinetics", "transition-state", "rare-events", "molecular-dynamics"]
categories = ["science"]
# Ship the library, its build script, the tests, and the three Org files the
# tests include with `include_str!`. CI, the Sphinx sources, and tool
# configuration stay out of the crate.
include = [
    "/src/**",
    "/tests/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/docs/orgmode/getting-started.org",
    "/docs/orgmode/howto.org",
    "/docs/orgmode/reference.org",
]

[lib]
crate-type = ["lib"]

[features]
default = []
# Static PES adapter over the published rgpot-core DLPack callback ABI,
# consumed by the native BAOAB integrator. Concrete potentials must be
# supplied as rgpot-core PotentialImpl handles.
rgpot = ["dep:rgpot-core"]
# Engine-agnostic MD session adapter wrapping rgpot's MdSession / CAbiMdSession
# contract ("openmm", "nblib", "lammps").
rgpot-session = ["dep:rgpot-core"]
# Direct lammpc-backed DynamicsEngine over lammpc_session_* C ABI. Only this
# engine uses the Cap'n Proto profile wire format, so only it enables the
# rgpot-core `profile` and `schema` features, whose build script needs the
# `capnp` CLI.
pafi-repro = ["dep:capnp", "dep:rgpot-core", "rgpot-core/profile"]
lammpc = ["dep:rgpot-core", "rgpot-core/profile", "rgpot-core/schema", "dep:capnp"]

[dependencies]
# Caret requirements on crates.io releases, so downstream builds can unify
# patch releases. Every dependency, and `Cargo.lock`, resolves from
# crates.io; there is no `[patch.crates-io]` table.
# `ci/check_dependency_pins.py` enforces this.
rgsaddle = { version = "0.6.0", git = "https://github.com/OmniPotentRPC/rgsaddle", rev = "e890b05f9be348a5a9b4ee5e3a76bd7b49be8320", default-features = false, features = ["ohtst"] }
rgmin = { version = "=0.7.0", git = "https://github.com/OmniPotentRPC/rgmin", rev = "f2527782713dcf4b4d5d91af9da1bba80c32bc0c", default-features = false }
rgpot-core = { version = "3.7.0", optional = true }
eindir-core = "0.6.0"
ndarray = "0.17"
rayon = "1.12"
rand = "0.9"
thiserror = "2"
capnp = { version = "0.20.6", optional = true }

[dev-dependencies]
approx = "0.5"
flate2 = "1"
sha2 = "0.10"
# Tag v3.6.0, as in rgsaddle: the copper tests evaluate its pair kernels.
rgpot-pair = { version = "=3.6.0", git = "https://github.com/OmniPotentRPC/rgpot", rev = "20c58fe5a2859cd0a79a3e06d64d567f96d0ccbe" }
proptest = "1.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[build-dependencies]
pkg-config = "0.3"

[profile.test]
# The PAFI analytic tests integrate millions of Langevin steps. Optimized
# code keeps them fast while debug assertions and overflow checks stay on.
opt-level = 2
